name: Build and Push Docker image
on:
  workflow_dispatch:

jobs:
  build:
    name: Build with buildx
    runs-on: ubuntu-latest
    steps:
      - name: Get latest H2 release
        id: h2
        run: |
          RELEASE_DATA=$(curl -s https://api.github.com/repos/h2database/h2database/releases/latest)

          DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url')
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name | sub("^version-"; "")')
          FILENAME=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".zip")) | .name')
          DATE=$(echo "$FILENAME" | sed -E 's/.*-([0-9]{4}-[0-9]{2}-[0-9]{2})\.zip/\1/')

          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT


      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker BuildX
        id: buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Cache Docker layers
        uses: actions/cache@v4.3.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
    
      - name: Login to Dockerhub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      

      - name: Inspect builder
        run: |
          echo "Name:           ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:       ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:         ${{ steps.buildx.outputs.status }}"
          echo "Flags:          ${{ steps.buildx.outputs.flags }}"
          echo "Platforms:      ${{ steps.buildx.outputs.platforms }}"
          echo "Trigger:        ${{ github.event_name }}"
          echo "Is Manual:      ${{ github.event_name == 'workflow_dispatch' }}"
          echo "H2 Version: ${{ steps.h2.outputs.version }}"
          echo "H2 Filename: ${{ steps.h2.outputs.filename }}"
          echo "H2 Download URL: ${{ steps.h2.outputs.download_url }}"
          echo "H2 Release Date: ${{ steps.h2.outputs.date }}"


      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/386,linux/arm/v7,linux/arm/v6
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          build-args: |
            H2_DOWNLOAD_URL=${{ steps.h2.outputs.download_url }}
            H2_VERSION=${{ steps.h2.outputs.version }}"
            H2_RELEASEDATE=${{ env.H2_RELEASEDATE || '2024-08-11' }}

      # layer caching
      # github의 repo는 5GB까지만 Cache 보관 가능
      # 수동으로 이전 캐시를 지우고 새로운 캐시를 옮겨놓는 과정
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          
      - name: Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: GeunChang Ahn
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took,pullRequest # selectable (default: repo,message)
#          mention: here
#          if_mention: failure, cancelled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}